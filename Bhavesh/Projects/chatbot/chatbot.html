<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Dashboard</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Navbar */
        nav {
            background: #2c3e50;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            cursor: pointer;
        }

        /* Chatbot Section */
        #chat-container {
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 60px;
            display: flex;
            flex-direction: column;
        }

        /* Bot left, User right */
        .bot-msg {
            max-width: 60%;
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 12px;
            background: #ecf0f1;
            align-self: flex-start;
        }

        .user-msg {
            max-width: 60%;
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 12px;
            background: #3498db;
            color: white;
            align-self: flex-end;
        }

        /* Input Bar */
        #input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            border-top: 1px solid #ddd;
        }

        #user-input {
            flex: 1;
            border: none;
            padding: 15px;
            font-size: 16px;
        }

        #send-btn {
            background: #2ecc71;
            border: none;
            color: white;
            padding: 0 20px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Modal for Name */
        #name-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #name-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
        }

        #name-box input {
            padding: 10px;
            font-size: 16px;
            width: 80%;
            margin-bottom: 15px;
        }

        #name-box button {
            padding: 10px 20px;
            background: #2ecc71;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Product Card */
        .product-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            border-radius: 10px;
        }

        .product-card h4 {
            margin: 10px 0 5px 0;
        }

        .product-card p {
            margin: 5px 0;
        }

        .product-card button {
            padding: 8px 15px;
            background: #2ecc71;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">🛒 Your Store</div>
        <ul>
            <li onclick="showPage('home')">Home</li>
            <li onclick="showPage('orders')">Orders</li>
            <li onclick="showPage('products')">Products</li>
            <li onclick="showPage('contact')">Contact</li>
            <li onclick="showPage('privacy')">Privacy Policy</li>
        </ul>
    </nav>

    <!-- Chatbot Container -->
    <div id="chat-container">
        <div id="chat-box">
            <div class="bot-msg" id="welcome-msg">Hello 👋, how can I help you?</div>
        </div>
    </div>

    <!-- Input -->
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type a message...">
        <button id="send-btn">Send</button>
    </div>

    <!-- Name Modal -->
    <div id="name-modal">
        <div id="name-box">
            <h2>Please enter your name</h2>
            <input type="text" id="name-input" placeholder="Your Name">
            <br>
            <button onclick="setName()">OK</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        let userName = "";
        let cart = [];
        let orders = [];
        const products = []; // will load from Firebase

        // Firebase config (fill your own)
        const firebaseConfig = {
            apiKey: "AIzaSyDhSKhvvWhabBSXGvS8EqhsVxegXEHKXjE",
            authDomain: "chatbhav-b5d5c.firebaseapp.com",
            projectId: "chatbhav-b5d5c",
            storageBucket: "chatbhav-b5d5c.firebasestorage.app",
            messagingSenderId: "211178731815",
            appId: "1:211178731815:web:3a292108a6718eb0bc5102"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Load products from Firebase
        function loadProducts() {
            db.collection("products").get().then(snapshot => {
                snapshot.forEach(doc => {
                    const p = doc.data();
                    products.push({ id: doc.id, name: p.name, price: p.price, img: p.img });
                });
            }).catch(err => console.error(err));
        }
        loadProducts();

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        function setName() {
            const nameInput = document.getElementById("name-input");
            if (nameInput.value.trim() === "") return;
            userName = nameInput.value.trim();
            document.getElementById("name-modal").style.display = "none";
            chatBox.innerHTML = `<div class="bot-msg">Welcome ${userName} 👋, how can I help you?</div>`;
        }

        function sendMessage() {
            const msg = userInput.value.trim();
            if (msg === "") return;

            let userDiv = document.createElement("div");
            userDiv.className = "user-msg";
            userDiv.textContent = `${userName}: ${msg}`;
            chatBox.appendChild(userDiv);

            chatBox.scrollTop = chatBox.scrollHeight;
            userInput.value = "";

            setTimeout(() => {
                let botDiv = document.createElement("div");
                botDiv.className = "bot-msg";
                botDiv.textContent = "Got it! I'll check that for you.";
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }

        // Show orders dynamically from Firebase
        function showOrders() {
            chatBox.innerHTML = "<h3>📦 Your Orders</h3>";
            db.collection("orders").where("user", "==", userName).orderBy("timestamp", "desc").get()
                .then(snapshot => {
                    if (snapshot.empty) chatBox.innerHTML += "<p>No orders yet.</p>";
                    snapshot.forEach(doc => {
                        const o = doc.data();
                        chatBox.innerHTML += `<p>Order: ${o.name} - ₹${o.price}, Delivery at: ${o.time}</p>`;
                    });
                }).catch(err => console.error(err));
        }

        function showPage(page) {
            if (page === "home") {
                chatBox.innerHTML = `<div class='bot-msg'>Welcome ${userName} 👋, how can I help you?</div>`;
            } else if (page === "orders") {
                showOrders();
            } else if (page === "products") {
                chatBox.innerHTML = "<h3>🛍️ Products</h3>";
                products.forEach(p => {
                    chatBox.innerHTML += `
                        <div class="product-card">
                            <img src="${p.img}" alt="${p.name}">
                            <h4>${p.name}</h4>
                            <p>Price: ₹${p.price}</p>
                            <button onclick="buyProduct('${p.id}')">Buy Now</button>
                        </div>`;
                });
            } else if (page === "contact") {
                chatBox.innerHTML = "<h3>📞 Contact Us</h3><p>Email: support@mystore.com</p><p>Phone: +91 9876543210</p>";
            } else if (page === "privacy") {
                chatBox.innerHTML = "<h3>🔒 Privacy Policy</h3><p>We respect your privacy. Your data is safe with us.</p>";
            }
        }

        function buyProduct(id) {
            const product = products.find(p => p.id === id);
            const deliveryTime = prompt(`When do you want the delivery for ${product.name}? (e.g., 5 PM)`, "5 PM");
            if (!deliveryTime) return;

            const order = {
                name: product.name,
                price: product.price,
                time: deliveryTime,
                user: userName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("orders").add(order)
                .then(() => {
                    alert("🎉 Order placed successfully!");
                    showPage('orders');
                    setTimeout(() => {
                        showPage('home');
                        let botDiv = document.createElement("div");
                        botDiv.className = "bot-msg";
                        botDiv.textContent = `Whoo! Your order successfully placed. Your bill will be coming by ${deliveryTime}`;
                        chatBox.appendChild(botDiv);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }, 1000);
                }).catch(err => console.error(err));
        }
    </script>
</body>

</html>
