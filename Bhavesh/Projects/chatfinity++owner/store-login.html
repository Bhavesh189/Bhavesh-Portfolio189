<!-- store-login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Store Owner Login</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{width:360px;background:#fff;padding:22px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
    h2{margin:0 0 10px;font-size:20px}
    label{display:block;margin-top:10px;font-size:13px;color:#333}
    input{width:100%;padding:10px;border-radius:6px;border:1px solid #ddd;margin-top:6px}
    button{margin-top:14px;width:100%;padding:10px;border-radius:6px;border:none;background:#1a73e8;color:#fff;cursor:pointer}
    .msg{margin-top:10px;font-size:14px;color:#b00020}
  </style>
</head>
<body>
  <div class="card">
    <h2>Store Owner Login</h2>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="owner@shop.com" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Your password" />
    <button id="loginBtn">Login</button>
    <div class="msg" id="msg"></div>
    <div style="margin-top:8px;font-size:13px;color:#666">
      Ask admin to add your account in Firebase Authentication if it doesn't exist.
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
  // ====== Replace with your Firebase config ======
  const firebaseConfig = {
    apiKey: "AIzaSyDhSKhvvWhabBSXGvS8EqhsVxegXEHKXjE",
    authDomain: "chatbhav-b5d5c.firebaseapp.com",
    projectId: "chatbhav-b5d5c",
    appId: "1:211178731815:web:3a292108a6718eb0bc5102"
  };
  // ==============================================
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const msgEl = document.getElementById('msg');
  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    msgEl.innerText = "";
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();
    if(!email || !pass){ msgEl.innerText = "Email & password required."; return; }
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      // save simple session flag
      sessionStorage.setItem("ownerSession", "true");
      // redirect
      window.location.href = "store-dashboard.html";
    } catch(err) {
      console.error(err);
      msgEl.innerText = err.message;
    }
  });

  // if already logged in
  if(sessionStorage.getItem("ownerSession")){
    window.location.href = "store-dashboard.html";
  }
  </script>
</body>
</html>
